<!doctype html>
<!-- html lang="en" by default; inline script updates lang attribute to "hi" when Hindi is selected in localStorage -->
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Node Not Found — Santosh Kumar Systems Hub</title>
  <meta name="description" content="404 Route Exception — The requested path does not exist on Santosh Kumar's Systems & Search Engine Engineering Portfolio.">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    (function() {
      try {
        var lang = localStorage.getItem('lang');
        if (lang === 'hi') {
          document.documentElement.setAttribute('lang', 'hi');
        } else {
          document.documentElement.setAttribute('lang', 'en');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #18181b;
      border: 1px solid rgba(239, 159, 39, 0.4);
      color: #EF9F27;
      font-family: monospace;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #EF9F27;
    }
    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
      color: #f4f4f5;
    }
    p {
      color: #a1a1aa;
      font-size: 1rem;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #EF9F27;
      color: #09090b;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="badge"><span class="dot"></span> 404 ROUTE EXCEPTION</div>
  <h1>Requested Node Offline</h1>
  <p>The path you navigated to does not exist on this cluster. Return to the primary systems engineering hub to explore live search architectures and selected works.</p>
  <a href="/" class="btn">Return to Systems Command Hub &rarr;</a>
</body>
</html>

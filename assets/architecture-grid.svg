    </text>
    <text x="24" y="118" fill="#94A3B8" fontFamily="system-ui, -apple-system, sans-serif" fontSize="13">
      and zero-CLS React 19 interfaces with Tailwind CSS v4.
    </text>
    <line x1="24" y1="140" x2="344" y2="140" stroke="#1E293B" strokeWidth="1" />
    <text x="24" y="162" fill="#64748B" fontFamily="JetBrains Mono, monospace" fontSize="11">
      TypeScript 5.8 · React 19 · Next.js · Tailwind v4
    </text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(416, 24)">
    <rect width="368" height="182" rx="14" fill="#0B0F19" stroke="#1E293B" strokeWidth="1.5" />
    <text x="24" y="36" fill="#3B82F6" fontFamily="JetBrains Mono, monospace" fontSize="11" fontWeight="600">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" height="100%">
  <rect width="1200" height="230" rx="18" fill="#07090E" stroke="#1E293B" strokeWidth="1.5" />

  <!-- Card 1 -->
  <g transform="translate(24, 24)">
    <rect width="368" height="182" rx="14" fill="#0B0F19" stroke="#1E293B" strokeWidth="1.5" />
    <text x="24" y="36" fill="#3B82F6" fontFamily="JetBrains Mono, monospace" fontSize="11" fontWeight="600">
      01 · WEB &amp; SEARCH ARCHITECTURE
    </text>

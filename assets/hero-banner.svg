<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#050507" />
      <stop offset="50%" stopColor="#0B0F19" />
      <stop offset="100%" stopColor="#07090E" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="50%" stopColor="#3B82F6" />
      <stop offset="100%" stopColor="#60A5FA" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" strokeWidth="0.7" opacity="0.55" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="340" rx="20" fill="url(#bg)" stroke="#1E293B" strokeWidth="2" />
  <rect width="1200" height="340" rx="20" fill="url(#grid)" />

  <!-- Top Accent Line -->
  <rect x="60" y="0" width="260" height="3" fill="url(#accent)" />

  <!-- Left Editorial Typography -->
  <text x="64" y="68" fill="#60A5FA" fontFamily="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" fontSize="13" fontWeight="600" letterSpacing="2">
    APPLICATION &amp; SYSTEMS ENGINEERING · @SANTOSHKUMARVVV
  </text>

  <text x="64" y="134" fill="#F8FAFC" fontFamily="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fontSize="48" fontWeight="800" letterSpacing="-1">
    Santosh Kumar
  </text>

  <text x="64" y="178" fill="#94A3B8" fontFamily="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fontSize="19" fontWeight="400">
    Building high-velocity TypeScript web systems, federated search routers,
  </text>
  <text x="64" y="206" fill="#94A3B8" fontFamily="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fontSize="19" fontWeight="400">
    native Dart &amp; Flutter mobile engines, and automated CI/CD pipelines.
  </text>

  <!-- Bottom Technical Readout Pills -->
  <g transform="translate(64, 246)">
    <rect width="190" height="44" rx="10" fill="#0F172A" stroke="#1E293B" strokeWidth="1.5" />
    <text x="18" y="18" fill="#64748B" fontFamily="JetBrains Mono, monospace" fontSize="10">PRIMARY STACK</text>
    <text x="18" y="34" fill="#F1F5F9" fontFamily="JetBrains Mono, monospace" fontSize="12" fontWeight="600">TypeScript · Dart</text>
  </g>

  <g transform="translate(270, 246)">
    <rect width="190" height="44" rx="10" fill="#0F172A" stroke="#1E293B" strokeWidth="1.5" />
    <text x="18" y="18" fill="#64748B" fontFamily="JetBrains Mono, monospace" fontSize="10">FRAMEWORKS</text>
    <text x="18" y="34" fill="#F1F5F9" fontFamily="JetBrains Mono, monospace" fontSize="12" fontWeight="600">React 19 · Next.js</text>
  </g>

  <g transform="translate(476, 246)">
    <rect width="195" height="44" rx="10" fill="#0F172A" stroke="#1E293B" strokeWidth="1.5" />
    <text x="18" y="18" fill="#64748B" fontFamily="JetBrains Mono, monospace" fontSize="10">INFRASTRUCTURE</text>
    <text x="18" y="34" fill="#60A5FA" fontFamily="JetBrains Mono, monospace" fontSize="12" fontWeight="600">Edge · CI/CD Matrix</text>
  </g>

  <!-- Right Side Architectural Telemetry Card -->
  <g transform="translate(760, 44)">
    <rect width="380" height="252" rx="16" fill="#090D16" stroke="#1E293B" strokeWidth="1.5" />
    <line x1="0" y1="44" x2="380" y2="44" stroke="#1E293B" strokeWidth="1" />
    <circle cx="24" cy="22" r="5" fill="#3B82F6" />
    <text x="40" y="26" fill="#E2E8F0" fontFamily="JetBrains Mono, monospace" fontSize="12" fontWeight="600">

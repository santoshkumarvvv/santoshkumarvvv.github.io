    </text>

    <!-- Metric 1 -->
    <text x="24" y="80" fill="#64748B" fontFamily="JetBrains Mono, monospace" fontSize="11">01. SEARCH HUB P95 LATENCY</text>
    <text x="290" y="80" fill="#60A5FA" fontFamily="JetBrains Mono, monospace" fontSize="13" fontWeight="700">38 ms</text>
    <rect x="24" y="92" width="332" height="6" rx="3" fill="#1E293B" />
    <rect x="24" y="92" width="308" height="6" rx="3" fill="url(#accent)" />

    <!-- Metric 2 -->
    <text x="24" y="134" fill="#64748B" fontFamily="JetBrains Mono, monospace" fontSize="11">02. AST &amp; UNIT VERIFICATION</text>
    <text x="290" y="134" fill="#F8FAFC" fontFamily="JetBrains Mono, monospace" fontSize="13" fontWeight="700">96.4%</text>
    <rect x="24" y="146" width="332" height="6" rx="3" fill="#1E293B" />
    <rect x="24" y="146" width="318" height="6" rx="3" fill="url(#accent)" />

    <!-- Metric 3 -->
    <text x="24" y="188" fill="#64748B" fontFamily="JetBrains Mono, monospace" fontSize="11">03. LIGHTHOUSE PERFORMANCE</text>
    <text x="285" y="188" fill="#60A5FA" fontFamily="JetBrains Mono, monospace" fontSize="13" fontWeight="700">99 / 100</text>
    <rect x="24" y="200" width="332" height="6" rx="3" fill="#1E293B" />
    <rect x="24" y="200" width="328" height="6" rx="3" fill="url(#accent)" />

    <text x="24" y="234" fill="#475569" fontFamily="JetBrains Mono, monospace" fontSize="10">
